name: Tests y Cobertura

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar Poetry
        run: pip install poetry
      - name: Instalar dependencias
        run: |
          poetry config virtualenvs.create false
          poetry install --with dev
      - name: Ejecutar pruebas con cobertura
        env:
          DATABASE_URL: sqlite:///blacklist.db
          BEARER_TOKEN: test-token-12345
        run: |
          pytest tests/ --cov=src --cov-report=term-missing --cov-report=xml
      - name: Verificar cobertura ≥ 90%
        run: |
          COVERAGE=$(python -c "import xml.etree.ElementTree as ET; tree=ET.parse('coverage.xml'); root=tree.getroot(); print(root.attrib['line-rate'])")
          COVERAGE_PCT=$(python -c "print(round(float('$COVERAGE')*100, 2))")
          echo "Cobertura: $COVERAGE_PCT%"
          if (( $(echo "$COVERAGE_PCT < 90" | bc -l) )); then
            echo "❌ Cobertura $COVERAGE_PCT% es menor que 90%"
            exit 1
          else
            echo "✅ Cobertura $COVERAGE_PCT% - ¡Mínimo alcanzado!"
          fi