name: Tests y Cobertura

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Poetry
        run: pip install poetry

      - name: Instalar dependencias
        run: |
          poetry config virtualenvs.create false
          poetry install --with dev

      - name: Ejecutar pruebas con cobertura
        env:
          DATABASE_URL: sqlite:///blacklist.db
          BEARER_TOKEN: test-token-12345
        run: |
          pytest tests/ --cov=src --cov-report=term-missing --cov-report=xml

      - name: Verificar cobertura ≥ 90%
        run: |
          python -c "
          import xml.etree.ElementTree as ET
          import sys
          tree = ET.parse('coverage.xml')
          root = tree.getroot()
          rate = float(root.attrib['line-rate']) * 100
          print(f'Cobertura: {rate:.2f}%')
          if rate < 90:
              print(f'❌ Cobertura {rate:.2f}% es menor que 90%')
              sys.exit(1)
          else:
              print(f'✅ Cobertura {rate:.2f}% - ¡Mínimo alcanzado!')
          "

# ==================================================
# JOB 2: Pruebas de integracion con Newman
# ==================================================
  pruebas_integracion:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Crear archivo .env para CI
        run: |
          echo "DATABASE_URL=postgresql://postgres:postgres@db:5432/blacklist_db" > .env
          echo "BEARER_TOKEN=test-token-12345" >> .env
          echo "FLASK_ENV=development" >> .env
          echo "FLASK_APP=src.main" >> .env
          echo "PORT=5000" >> .env

      - name: Levantar servicios con Docker Compose
        run: docker compose up -d --build

      - name: Esperar inicializacion revisando los logs
        run: |
          echo "Esperando a que la API confirme la conexion a la BD..."
          for i in {1..40}; do
            if docker compose logs | grep -q "Tablas creadas correctamente"; then
              echo "✅ App y Base de Datos listas (Intento $i)"
              exit 0
            fi
            sleep 3
          done
          echo "❌ ERROR: La app no confirmo la creacion de tablas."
          docker compose logs
          exit 1

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Newman
        run: npm install -g newman

      - name: Ejecutar pruebas de integracion con Newman
        continue-on-error: true
        run: |
          newman run blacklist-api.postman_collection.json \
            --env-var baseUrl=http://localhost:5001 \
            --env-var token=test-token-12345 \
            --env-var BEARER_TOKEN=test-token-12345

      - name: Detener servicios
        if: always()
        run: docker compose down